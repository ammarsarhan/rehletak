# Local stand-ins for the two Railway Redis services. Postgres comes from a Neon dev branch, not from here.
services:
  cache:
    image: redis:8-alpine
    # A cache is allowed to forget: evict the least recently used keys once memory is full.
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"

  queue:
    image: redis:8-alpine
    # BullMQ requires noeviction, otherwise Redis can silently drop jobs under memory pressure. AOF keeps jobs across restarts.
    command: redis-server --maxmemory-policy noeviction --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - queue:/data

volumes:
  queue:
